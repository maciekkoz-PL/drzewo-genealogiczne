<script language="JavaScript" type="text/javascript">    


        var sessionTimeoutWarning = '29'; 
        var sessionTimeout = '30';
        var imgHiddenDotID = 'imgHiddenDot';
        
        var timeOnPageLoad = new Date();
        var sessionWarningTimer = null;
        var redirectToWelcomePageTimer = null;

        function fHandleSessionTimeOut()
        {	         
            //For warning
            sessionWarningTimer = setTimeout('SessionWarning()', parseInt(sessionTimeoutWarning) * 60 * 1000);
            //To redirect to the welcome page
            redirectToWelcomePageTimer = setTimeout('RedirectToWelcomePage()', parseInt(sessionTimeout) * 60 * 1000);
        }

        //Session Warning
        function SessionWarning()
        {
            //minutes left for expiry
            var minutesForExpiry =  (60 * (parseInt(sessionTimeout) - parseInt(sessionTimeoutWarning)));
            var message = "Your session will expire in another " + minutesForExpiry + " seconds. Do you want to extend the session?";

            //Confirm the user if he wants to extend the session
            answer = confirm(message);

            //if yes, extend the session.
            if(answer)
            {
                var currentTime = new Date();
                //time for expiry
                var timeForExpiry = timeOnPageLoad.setMinutes(timeOnPageLoad.getMinutes() + 
		            parseInt(sessionTimeout));     		
                
                //Current time is greater than the expiry time
                if(Date.parse(currentTime) > timeForExpiry)
                {
                    //window.location = "/../scripts/Logon.asp?N=guest&LoginFrom=Expire";
                    window.location = "/SearchNRetrieve/Guest.aspx";
                }
                else
                {                
                    var img = document.getElementById(imgHiddenDotID);
                    var rndm=Math.floor(Math.random()*11);
                    img.src = '/SearchNRetrieve/KeepSessionAlive.aspx?RN=' + rndm;

                    //Clear the RedirectToWelcomePage method
                    if (redirectToWelcomePageTimer != null) 
                    {
                        clearTimeout(redirectToWelcomePageTimer);
                    }
                    //reset the time on page load
                    timeOnPageLoad =  new Date();
                    sessionWarningTimer = setTimeout('SessionWarning()', parseInt(sessionTimeoutWarning) * 60 * 1000);
                    //To redirect to the welcome page
                    redirectToWelcomePageTimer = setTimeout('RedirectToWelcomePage()',parseInt(sessionTimeout) * 60 * 1000);
                }
            }
            else
            {
                var currentTime = new Date();
                //time for expiry
                var timeForExpiry = timeOnPageLoad.setMinutes(timeOnPageLoad.getMinutes() + 
		            parseInt(sessionTimeout));     		

                //Current time is greater than the expiry time
                if(Date.parse(currentTime) > timeForExpiry)
                {
                    //window.location = "/../scripts/Logon.asp?N=guest&LoginFrom=Expire";
                    window.location = "/SearchNRetrieve/Guest.aspx";
                }
            }
        }                
                
        //Session timeout
        function RedirectToWelcomePage()
        {
            //window.location = "/../scripts/Logon.asp?N=guest&LoginFrom=Expire";
            window.location = "/SearchNRetrieve/Guest.aspx";
        }      
	     
	             
         if (bTimeSession)
         {        
             $(document).ready(fHandleSessionTimeOut);
         }
         
</script></head>
