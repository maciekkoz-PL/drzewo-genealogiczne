  <script>
    (function () {
      var activeField = null;

      function isTextField(field) {
        if (!field) {
          return false;
        }

        if (field.tagName === 'TEXTAREA') {
          return true;
        }

        if (field.tagName !== 'INPUT') {
          return false;
        }

        return ['email', 'search', 'tel', 'text', 'url'].indexOf((field.type || 'text').toLowerCase()) !== -1;
      }

      document.addEventListener('focusin', function (event) {
        if (isTextField(event.target)) {
          activeField = event.target;
        }
      });

      document.querySelectorAll('.diacritic-btn').forEach(function (button) {
        button.addEventListener('click', function () {
          if (!isTextField(activeField)) {
            return;
          }

          var character = this.getAttribute('data-char');
          var start = activeField.selectionStart || 0;
          var end = activeField.selectionEnd || 0;
          var value = activeField.value || '';

          activeField.value = value.substring(0, start) + character + value.substring(end);
          activeField.focus();
          activeField.selectionStart = start + character.length;
          activeField.selectionEnd = start + character.length;
          activeField.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });
    }());
  </script>
