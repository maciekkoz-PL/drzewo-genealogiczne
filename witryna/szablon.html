<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Rodzinna opowieść Marysi — drzewo genealogiczne i kronika odkryć."><title>Korzenie Marysi · rodzinne odkrycia</title>
<style>
:root{--ink:#203e3c;--paper:#faf8f2;--line:#deded0;--green:#2b6c59;--gold:#946528;--muted:#65736e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header,main,footer{max-width:1440px;margin:auto;padding:24px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}a{color:var(--green);text-underline-offset:4px}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:700;color:var(--green)}h1{font:normal clamp(36px,5vw,64px)/1.15 Georgia,serif;letter-spacing:-.04em;margin:10px 0 18px}h1 em{color:var(--green)}.updated{font-size:12px;color:var(--muted);margin-top:20px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:36px 0 16px;flex-wrap:wrap}h2{font:normal 30px/1.2 Georgia,serif;margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button,select,input,.pill{border:1px solid #cdd5cb;border-radius:8px;background:#fffdf8;padding:8px 12px;color:var(--ink)}input{width:230px}.tools button:hover,.pill:hover{background:#edf2e8}.legend{display:flex;gap:24px;flex-wrap:wrap;font-size:12px;margin:14px 0;color:var(--muted)}.legend i{display:inline-block;width:24px;border-top:2px solid var(--green);vertical-align:middle;margin-right:7px}.legend .family{border-top:2px dashed #8c9896}.legend .identity{border-top:2px dashed var(--gold)}.viewport{height:650px;overflow:auto;border:1px solid var(--line);border-radius:16px;background-color:#f0f3eb;background-image:radial-gradient(#c8d1c3 .7px,transparent .7px);background-size:20px 20px;position:relative}.canvas{position:relative;width:1540px;height:960px;transform-origin:top left}.canvas svg{position:absolute;inset:0;width:1540px;height:960px;pointer-events:none}.node{position:absolute;width:240px;min-height:142px;border:1px solid #b8cbbb;border-top:3px solid var(--green);border-radius:10px;background:#fffef9;text-align:left;padding:14px 16px;box-shadow:0 3px 10px #24443409;color:var(--ink);transition:box-shadow .2s,background .2s}.node:hover,.node:focus-visible{box-shadow:0 8px 24px #24443426;background:#fff;outline:2px solid #7a9a82;outline-offset:2px}.node .name{font:600 19px/1.2 Georgia,serif;display:block;margin:7px 0}.node small{display:block;color:var(--muted);font-size:11px;line-height:1.4}.node .dates{font-size:12px;margin-top:8px}.node.identity{border-top-color:var(--gold)}.node.family{border-top:3px dashed #8c9896}.node[data-id=P01]{background:#244e42;color:#fff;border-color:#244e42}.node[data-id=P01] small{color:#d8e7da}.node .badge{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--green)}.node.identity .badge{color:var(--gold)}.node.family .badge{color:#6d7b76}.node[data-id=P01] .badge{color:#d9e7c7}.tree-help{font-size:12px;color:var(--muted);margin:10px 0}.news-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}.kronika{margin-top:56px}.sub{font-size:13px;color:var(--muted);margin:12px 0 22px}.news{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.entry{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:24px}.entry time{font-size:11px;color:var(--muted)}.entry h3{font:normal 23px/1.25 Georgia,serif;margin:10px 0}.entry p{font-size:14px;color:var(--muted);margin:0}.empty{padding:24px;border:1px solid var(--line);border-radius:12px}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:18px}dialog{width:min(570px,calc(100% - 24px));max-height:90vh;border:1px solid #bbc9bb;border-radius:16px;padding:30px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#142e2bcc;backdrop-filter:blur(3px)}dialog h2{margin:12px 35px 18px 0}.close{position:absolute;top:18px;right:18px;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;background:#fff;font-size:20px}.detail-dates{font-size:18px}.detail-note{font-size:15px}.source{display:block;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.source p{margin:3px 0;color:var(--muted)}.related{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.pill{font-size:12px}.mobile-list{margin:14px 0}.mobile-list select{width:100%}.noscript{padding:20px}html{scroll-behavior:smooth}@media(max-width:700px){header,main,footer{padding:20px}header h1{font-size:43px}.viewport{height:480px}.news,.tools{width:100%}input{flex:1;width:120px}.entry{padding:20px}footer{flex-direction:column}.legend{gap:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
header,main{padding:16px 28px;max-width:1600px}header{gap:16px}header h1{font:600 23px/1.2 system-ui,sans-serif;letter-spacing:0;margin:0}.updated{margin:0;font-size:12px}.section-top{margin:0 0 10px}.tools{width:100%}.tools input{margin-right:auto}.legend{margin:10px 0}.mobile-list{margin:10px 0}.viewport{height:calc(100vh - 240px);min-height:490px;max-height:900px;background-image:none}.tree-help{margin:6px 0}.kronika{margin:28px 0 16px}h2{font:600 19px/1.3 system-ui,sans-serif}.news{display:block;margin-top:12px}.entry{display:grid;grid-template-columns:165px 1fr;gap:20px;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:15px 0}.entry time{font-size:12px;padding-top:3px}.entry h3{font:600 15px/1.4 system-ui,sans-serif;margin:0 0 3px}.entry p{font-size:13px}.sub{font-size:11px;margin:8px 0}.news-head select{font-size:12px;padding:6px 10px}
@media(max-width:700px){header,main{padding:14px 16px}header{align-items:flex-start;flex-direction:column;gap:5px}header h1{font-size:21px}.viewport{height:calc(100vh - 250px);min-height:420px}.entry{grid-template-columns:1fr;gap:4px;padding:12px 0}.entry time{padding:0}.legend{font-size:10px;gap:10px}.tools input{margin:0}.section-top{margin-top:0}}
</style></head>
<body><header><h1>Drzewo Marysi</h1><div class="updated" id="updated"></div></header><main>
<section id="drzewo"><div class="section-top"><div class="tools"><input id="search" type="search" aria-label="Znajdź osobę" placeholder="Znajdź osobę…"><button id="minus" aria-label="Pomniejsz drzewo">−</button><button id="plus" aria-label="Powiększ drzewo">+</button><button id="fit">Całe drzewo</button></div></div>
<div class="legend"><span><i></i>Dokument</span><span><i class="identity"></i>Identyfikacja pary w toku</span><span><i class="family"></i>Przekaz rodzinny</span></div><div class="mobile-list"><select id="people" aria-label="Otwórz kartę osoby"><option value="">Wybierz osobę, aby zobaczyć szczegóły</option></select></div>
<div class="viewport" id="viewport" aria-label="Interaktywne drzewo genealogiczne"><div id="sizer"><div class="canvas" id="canvas"><svg id="lines" viewBox="0 0 1540 960" aria-hidden="true"></svg></div></div></div><p class="tree-help">Kliknij osobę, aby zobaczyć szczegóły.</p></section>
<section class="kronika" id="odkrycia"><div class="news-head"><h2>Najważniejsze odkrycia</h2><select id="period" aria-label="Okres odkryć"><option value="week">Ostatnie 7 dni</option><option value="all">Wszystkie</option></select></div><div class="news" id="news"></div><p class="sub">Godziny zapisu ustaleń · czas polski.</p></section>
</main>
<dialog id="person"><button class="close" id="close" aria-label="Zamknij kartę">×</button><div id="detail"></div></dialog><noscript><p class="noscript">Do wyświetlenia interaktywnego drzewa i kroniki włącz JavaScript.</p></noscript>
<script id="family-data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('family-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),byId=Object.fromEntries(D.people.map(p=>[p.id,p]));
const dt=s=>new Intl.DateTimeFormat('pl-PL',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Warsaw'}).format(new Date(s));
$('updated').textContent='Aktualizacja: '+dt(D.generated);
const labels={document:'Dokument',identity:'Identyfikacja w toku',family:'Przekaz rodzinny'};
for(const p of D.people){const b=document.createElement('button');b.className='node '+p.status;b.dataset.id=p.id;b.style.left=p.x+'px';b.style.top=p.y+'px';b.setAttribute('aria-label','Szczegóły: '+p.name);b.innerHTML=`<span class="badge">${labels[p.status]}</span><span class="name">${esc(p.name)}</span><small>${esc(p.role)}</small><div class="dates">${esc(p.dates)}</div>`;b.onclick=()=>openPerson(p.id);$('canvas').appendChild(b);const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('people').appendChild(o)}
for(const [a,b,type]of D.edges){const A=byId[a],B=byId[b];let d;if(type==='marriage'||type==='sibling'){const left=A.x<B.x?A:B,right=left===A?B:A;d=`M${left.x+240},${left.y+66} L${right.x},${right.y+66}`}else{const x=A.x+120,y=A.y+document.querySelector(`[data-id="${a}"]`).offsetHeight,X=B.x+120,Y=B.y;d=`M${x},${y} V${y+(Y-y)*.5} H${X} V${Y}`}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke',type==='identity'?'#ab7d3e':type==='family'||type==='sibling'?'#8c9896':type==='marriage'?'#8e859e':'#729b7c');path.setAttribute('stroke-width','1.7');if(['identity','family','sibling'].includes(type))path.setAttribute('stroke-dasharray','6 5');$('lines').appendChild(path)}
function openPerson(id){const p=byId[id];const relatives=[...new Set(D.edges.filter(e=>e[0]===id||e[1]===id).map(e=>e[0]===id?e[1]:e[0]))];$('detail').innerHTML=`<div class="eyebrow">${esc(labels[p.status])}</div><h2>${esc(p.name)}</h2><p class="detail-dates">${esc(p.dates)}</p><p>${esc(p.place)}</p><p class="detail-note">${esc(p.note)}</p><h3>Powiązane osoby</h3><div class="related">${relatives.map(r=>`<button class="pill" data-open="${r}">${esc(byId[r].name)}</button>`).join('')}</div><h3>Podstawa informacji</h3>${p.source.map(id=>{const s=D.sources[id];return `<div class="source">${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`:`<strong>${esc(s.title)}</strong>`}${s.description?`<p>${esc(s.description)}</p>`:''}</div>`}).join('')}`;$('detail').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open));if(!$('person').open)$('person').showModal();location.hash='osoba-'+id}
$('close').onclick=()=>{$('person').close();location.hash='drzewo'};$('person').addEventListener('click',e=>{if(e.target===$('person'))$('close').click()});$('people').onchange=e=>{if(e.target.value)openPerson(e.target.value)};
let scale=1;function zoom(v){scale=Math.max(.25,Math.min(1.6,v));$('canvas').style.transform=`scale(${scale})`;$('sizer').style.width=1540*scale+'px';$('sizer').style.height=960*scale+'px'}$('plus').onclick=()=>zoom(scale+.15);$('minus').onclick=()=>zoom(scale-.15);$('fit').onclick=()=>{zoom(Math.min($('viewport').clientWidth/1540, $('viewport').clientHeight/960));$('viewport').scrollTo(0,0)};zoom(innerWidth<700?.72:.85);
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').toLowerCase();$('search').oninput=e=>{const q=normalize(e.target.value);document.querySelectorAll('.node').forEach(b=>{const p=byId[b.dataset.id];b.style.opacity=!q||normalize(p.name+' '+p.role).includes(q)?'1':'.25'})};$('search').onkeydown=e=>{if(e.key==='Enter'){const q=normalize(e.target.value),p=D.people.find(p=>normalize(p.name+' '+p.role).includes(q));if(p)openPerson(p.id)}};
function renderNews(){const week=$('period').value==='week',cutoff=Date.now()-7*86400000;const news=D.news.filter(n=>!week||new Date(n.at).getTime()>=cutoff).sort((a,b)=>new Date(b.at)-new Date(a.at));$('news').innerHTML=news.length?news.map(n=>`<article class="entry"><time datetime="${esc(n.at)}">${dt(n.at)}</time><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div></article>`).join(''):'<p class="empty">Brak nowych zapisów w ostatnich 7 dniach. Wybierz „Wszystkie”, aby zobaczyć wcześniejsze odkrycia.</p>'}$('period').onchange=renderNews;renderNews();const match=location.hash.match(/^#osoba-(P\d+)$/);if(match&&byId[match[1]])openPerson(match[1]);
</script></body></html>
