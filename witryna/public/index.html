"id": "P03", "name": "Czesław Chmielewski", "role": "Ojciec Bogusława — nazwisko w odpisie", "dates": "Ur. 03.07.1909*", "place": "Rogoźno → Łódź", "note": "Odpis ślubu Bogusława wymienia ojca Czesława Chmielewskiego. Data 1909 pochodzi z osobnego aktu, powiązanego ze ślubem pary w 1936 r. *Dodatkowe potwierdzenie, że to dokładnie ta osoba, pozostaje otwarte (H017). Ślub z Janiną: 03.05.1936, Łódź, akt 110.", "source": ["S086", "S001", "S071"], "x": 800, "y": 280, "status": "identity", "branch": "paternal", "evidence": "document"}, {"id": "P04", "name": "Janina Poprawka", "role": "Matka Bogusława — nazwisko w odpisie", "dates": "Ur. 12.05.1910*", "place": "Socha → Łódź", "note": "Odpis ślubu Bogusława wymienia matkę Janinę, z domu Poprawkę. Data 1910 pochodzi z osobnego aktu, powiązanego ze ślubem pary w 1936 r. *Dodatkowe potwierdzenie, że to dokładnie ta osoba, pozostaje otwarte (H017). Po ślubie Chmielewska.", "source": ["S086", "S001", "S063"], "x": 1180, "y": 280, "status": "identity", "branch": "paternal", "evidence": "document"}, {"id": "P11", "name": "Brat Bogusława", "role": "Imię pozostaje nieznane", "dates": "Daty nieustalone", "place": "", "note": "Według przekazu rodzinnego Bogusław miał brata, który był ojcem kuzyna Marysi. Brak dokumentu potwierdzającego tę relację. Nie przypisujemy mu imienia na podstawie grobów ani zbieżności nazwiska.", "source": ["REL"], "x": 1060, "y": 560, "status": "family", "branch": "paternal", "evidence": "family"}, {"id": "P02", "name": "Bogusław Kazimierz Chmielewski", "role": "Tata Marysi", "dates": "25.04.1943 – 1988†", "place": "Łódź", "note": "Odpis ślubu potwierdza urodzenie 25.04.1943 w Łodzi i podaje rodziców: Czesława Chmielewskiego oraz Janinę Poprawkę. Ślub w Warszawie 13.11.1982; adnotacja rozwodu z 23.04.1985. †Zgon w 1988 r. pochodzi z przekazu rodzinnego i nadal wymaga dokumentu.", "source": ["S086", "REL"], "x": 1320, "y": 560, "status": "document", "branch": "paternal", "evidence": "document"}, {"id": "P17", "name": "Maria Jankowska", "role": "Mama Marysi — według przekazu", "dates": "Ur. 04.01.1942", "place": "Strzegowo · pow. mławski", "note": "S086 podaje imię, nazwisko rodowe Jankowska, urodzenie oraz rodziców Romana Jankowskiego i Annę z domu Kulas. Ślub z Bogusławem: 13.11.1982 Warszawa; po ślubie Chmielewska, rozwód 23.04.1985. Macierzyństwo wobec Marysi i rodzeństwo pochodzą z przekazu rodzinnego: Maria najstarsza, Andrzej około 1946, Teresa około 1950. Maria żyje według przekazu; obecnie używane nazwisko nieustalone. Strzegowo pow. mławski jest odrębne od Strzegowej pow. olkuski.", "source": ["S086", "REL-009"], "x": 2180, "y": 560, "status": "document", "branch": "maternal", "evidence": "document"}, {"id": "P10", "name": "Piotr Chmielewski", "role": "Kuzyn Marysi — według przekazu", "dates": "Ur. ok. 1969–1973†", "place": "", "note": "Syn nieznanego z imienia brata Bogusława — według relacji rodziny. †Przedział urodzenia to oszacowanie na podstawie przybliżonego wieku, a nie odczyt z aktu. Rodzina pamięta jego udział w mundurze policjanta w pogrzebie Tomasza w 2001 r. Nie potwierdzono, czy jest osobą opisaną w artykułach o policjancie z Łodzi. Pokrewieństwo nadal wymaga dokumentów.", "source": ["REL"], "x": 1060, "y": 840, "status": "family", "branch": "paternal", "evidence": "family"}, {"id": "P09", "name": "Tomasz Chmielewski", "role": "Przyrodni brat Marysi", "dates": "Zm. 26.04.2001† · 30 lat", "place": "", "note": "Imię, nazwisko, dzień 26 IV i wiek odczytano z rodzinnych fotografii nagrobka. †Rok 2001 oraz relacja ojciec–syn z Bogusławem pochodzą z przekazu rodzinnego; rok na zdjęciu jest częściowo zasłonięty. Nie znamy dokładnej daty urodzenia.", "source": ["S027", "REL"], "x": 1540, "y": 840, "status": "document", "branch": "paternal", "evidence": "document"}, {"id": "P01", "name": "Marysia", "role": "Od niej zaczyna się ta opowieść", "dates": "Ur. ok. 1984†", "place": "", "note": "Córka Bogusława i Marii według przekazu rodzinnego. †Przybliżony rok  const relatives=currentEdges.filter(e=>e[0]===id||e[1]===id).map(e=>({id:e[0]===id?e[1]:e[0],kind:e[2]}));
 const unique=[...new Map(relatives.map(r=>[r.id,r])).values()];
 $('detail').innerHTML=`<div class="eyebrow">${esc(labels[p.status])}</div><h2>${esc(p.name)}</h2><p class="detail-dates">${esc(p.dates)}</p><p>${esc(p.place)}</p><p class="detail-note">${esc(p.note)}</p>${unique.length?`<h3>Powiązane osoby</h3><div class="related">${unique.map(r=>`<button class="pill" data-open="${r.id}">${esc(byId[r.id].name)}${r.kind==='hypothesis'?' · hipoteza':r.kind==='identity'?' · identyfikacja w toku':['family','sibling'].includes(r.kind)?' · przekaz rodzinny':''}</button>`).join('')}</div>`:''}<h3>Podstawa informacji</h3>${p.source.map(sid=>{const s=D.sources[sid];return `<div class="source">${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`:`<strong>${esc(s.title)}</strong>`}${s.description?`<p>${esc(s.description)}</p>`:''}</div>`}).join('')}`;
 $('detail').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open));
 if(!$('person').open)$('person').showModal();location.hash='osoba-'+id;
 $('people').value=id;
 const pos=positions[id];$('viewport').scrollTo({left:Math.max(0,(pos.x+120)*scale-$('viewport').clientWidth/2),top:Math.max(0,(pos.y+70)*scale-$('viewport').clientHeight/2)});
}
function applySearch(){
 const q=normalize($('search').value);
 $('canvas').querySelectorAll('.node').forEach(b=>{const p=byId[b.dataset.id];b.style.opacity=!q||normalize(p.name+' '+p.role).includes(q)?'1':'.25'});
}
function changeView(){if($('person').open)$('close').click();renderTree()}
$('evidence').onchange=changeView;$('branch').onchange=changeView;
$('close').onclick=()=>{$('person').close();location.hash='drzewo'};
$('person').addEventListener('click',e=>{if(e.target===$('person'))$('close').click()});
$('people').onchange=e=>{if(e.target.value)openPerson(e.target.value)};
$('plus').onclick=()=>zoom(scale+.15);$('minus').onclick=()=>zoom(scale-.15);$('fit').onclick=fit;
$('search').oninput=applySearch;
$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const q=normalize(e.target.value),p=currentPeople.find(p=>normalize(p.name+' '+p.role).includes(q));if(p)openPerson(p.id)}};
function renderNews(){
 const week=$('period').value==='week',cutoff=Date.now()-7*86400000;
 const news=D.news.filter(n=>!week||new Date(n.at).getTime()>=cutoff).sort((a,b)=>new Date(b.at)-new Date(a.at));
 $('news').innerHTML=news.length?news.map(n=>`<article class="entry"><time datetime="${esc(n.at)}">${dt(n.at)}</time><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div></article>`).join(''):'<p class="empty">Brak nowych zapisów w ostatnich 7 dniach. Wybierz „Wszystkie”, aby zobaczyć wcześniejsze odkrycia.</p>';
}
$('period').onchange=renderNews;renderNews();renderTree();
const match=location.hash.match(/^#osoba-([PC]\d+)$/);if(match&&byId[match[1]])openPerson(match[1]);

</script></body></html>
