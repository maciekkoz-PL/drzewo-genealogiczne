"id": "P03", "name": "Czesław Chmielewski", "role": "Ojciec Bogusława — nazwisko w odpisie", "dates": "Ur. 03.07.1909*", "place": "Rogoźno → Łódź", "note": "Odpis ślubu Bogusława wymienia ojca Czesława Chmielewskiego. Data 1909 pochodzi z osobnego aktu, powiązanego ze ślubem pary w 1936 r. *Dodatkowe potwierdzenie, że to dokładnie ta osoba, pozostaje otwarte (H017). Ślub z Janiną: 03.05.1936, Łódź, akt 110.", "source": ["S086", "S001", "S071"], "x": 800, "y": 280, "status": "identity", "branch": "paternal", "evidence": "document"}, {"id": "P04", "name": "Janina Poprawka", "role": "Matka Bogusława — nazwisko w odpisie", "dates": "Ur. 12.05.1910*", "place": "Socha → Łódź", "note": "Odpis ślubu Bogusława wymienia matkę Janinę, z domu Poprawkę. Data 1910 pochodzi z osobnego aktu, powiązanego ze ślubem pary w 1936 r. *Dodatkowe potwierdzenie, że to dokładnie ta osoba, pozostaje otwarte (H017). Po ślubie Chmielewska.", "source": ["S086", "S001", "S063"], "x": 1180, "y": 280, "status": "identity", "branch": "paternal", "evidence": "document"}, {"id": "P11", "name": "Brat Bogusława", "role": "Imię pozostaje nieznane", "dates": "Daty nieustalone", "place": "", "note": "Według przekazu rodzinnego Bogusław miał brata, który był ojcem kuzyna Marysi. Brak dokumentu potwierdzającego tę relację. Nie przypisujemy mu imienia na podstawie grobów ani zbieżności nazwiska.", "source": ["REL"], "x": 800, "y": 560, "status": "family", "branch": "paternal", "evidence": "family"}, {"id": "P02", "name": "Bogusław Kazimierz Chmielewski", "role": "Tata Marysi", "dates": "25.04.1943 – 1988†", "place": "Łódź", "note": "Odpis ślubu potwierdza urodzenie 25.04.1943 w Łodzi i podaje rodziców: Czesława Chmielewskiego oraz Janinę Poprawkę. Ślub w Warszawie 13.11.1982; adnotacja rozwodu z 23.04.1985. †Zgon w 1988 r. pochodzi z przekazu rodzinnego i nadal wymaga dokumentu.", "source": ["S086", "REL"], "x": 1080, "y": 560, "status": "document", "branch": "paternal", "evidence": "document"}, {"id": "P17", "name": "Maria Jankowska", "role": "Mama Marysi", "dates": "Ur. 04.01.1942", "place": "Strzegowo", "note": "Mama Marysi, zgodnie z potwierdzeniem rodziny. Odpis ślubu podaje imię Maria, nazwisko rodowe Jankowska, datę i miejsce urodzenia oraz rodziców: Romana Jankowskiego i Annę z domu Kulas. Ślub z Bogusławem: 13.11.1982 Warszawa; po ślubie Chmielewska; adnotacja rozwodu: 23.04.1985. Nie ustalono informacji o zgonie ani obecnie używanego nazwiska.", "source": ["S086", "REL-009"], "x": 1080, "y": 1280, "status": "document", "branch": "maternal", "evidence": "document"}, {"id": "P10", "name": "Piotr Chmielewski", "role": "Kuzyn Marysi — według przekazu", "dates": "Ur. ok. 1969–1973†", "place": "", "note": "Syn nieznanego z imienia brata Bogusława — według relacji rodziny. †Przedział urodzenia to oszacowanie na podstawie przybliżonego wieku, a nie odczyt z aktu. Rodzina pamięta jego udział w mundurze policjanta w pogrzebie Tomasza w 2001 r. Nie potwierdzono, czy jest osobą opisaną w artykułach o policjancie z Łodzi. Pokrewieństwo nadal wymaga dokumentów.", "source": ["REL"], "x": 800, "y": 800, "status": "family", "branch": "paternal", "evidence": "family"}, {"id": "P09", "name": "Tomasz Chmielewski", "role": "Przyrodni brat Marysi", "dates": "Zm. 26.04.2001† · 30 lat", "place": "", "note": "Imię, nazwisko, dzień 26 IV i wiek odczytano z rodzinnych fotografii nagrobka. †Rok 2001 oraz relacja ojciec–syn z Bogusławem pochodzą z przekazu rodzinnego; rok na zdjęciu jest częściowo zasłonięty. Nie znamy dokładnej daty urodzenia.", "source": ["S027", "REL"], "x": 1360, "y": 800, "status": "document", "branch": "paternal", "evidence": "document"}, {"id": "P01", "name": "Marysia", "role": "Córka Bogusława i Marii", "dates": "Ur. ok. 1984†", "place": "", "note": "Rodzice Marysi to Bogusław Kazimierz Chmielewski i Maria Jankowska — potwierdzone przez rodzinę. Te połączenia są zawsze widoczne w drzewie. †Przybliżony rok urodzenia pochodzi z historii rodzinnej. Nie ustalono jej p
